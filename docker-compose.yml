services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alpharisk
      POSTGRES_PASSWORD: alpharisk
      POSTGRES_DB: alphariskiq
    ports:
      - "5432:5432"
    volumes:
      - alpharisk_pgdata:/var/lib/postgresql/data
    healthcheck:
      # The backend creates its schema on startup, so it must not start until
      # Postgres is actually accepting connections - not merely "container up".
      test: ["CMD-SHELL", "pg_isready -U alpharisk -d alphariskiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://alpharisk:alpharisk@db:5432/alphariskiq
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      DATA_ROOT: /data
    ports:
      - "8000:8000"
    volumes:
      # Read-only: the price series, universe definitions and scenario library are
      # inputs. A container that can rewrite its own scenario magnitudes is a
      # container whose stress results cannot be reproduced.
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  alpharisk_pgdata:
